{% assign t = site.data.i18n[page.lang] %}

<footer class="footer">
  <p class="footer-text">{{ t.footer.copyright }}</p>
  {% comment %}分隔符由 CSS 的 .footer-links > * + *::before 提供，不写成独立元素，
  这样它跟随后一项折行，不会在窄屏被孤立在行首或行尾{% endcomment %}
  <div class="footer-links">
    <a href="https://www.suat-sz.edu.cn/" target="_blank" rel="noopener noreferrer">{{ t.footer.university }}</a>
    <a href="https://cme.suat-sz.edu.cn/" target="_blank" rel="noopener noreferrer">{{ t.footer.cme }}</a>
    <span>{{ t.footer.center }}</span>
  </div>
</footer>
